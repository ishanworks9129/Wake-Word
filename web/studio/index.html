<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake Word Studio</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #16181d; --muted: #5d6470; --line: #dde1e7; --soft: #eef2fb;
      --accent: #2f6bf0; --accent-soft: #c9d8fb; --hit: #1a7f37; --error: #b42318; --warn: #9a6700;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1b1e24; --text: #eceef2; --muted: #a3aab6; --line: #2e333c; --soft: #1f2633;
        --accent: #6d93ff; --accent-soft: #2c3b5e; --hit: #4ac26b; --error: #ff8a80; --warn: #d4a72c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 32px 16px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    .lede { color: var(--muted); margin: 0 0 20px; }
    .muted { color: var(--muted); }
    .panel { background: var(--card); border: 2px solid var(--text); border-radius: 14px; overflow: hidden; }
    .panel-top { padding: 18px; border-bottom: 1px solid var(--line); }
    .row { display: flex; gap: 10px; align-items: stretch; }
    select, input[type=text] { font: inherit; font-size: 1.05rem; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    select { width: 140px; }
    input[type=text] { flex: 1; min-width: 0; }
    button { font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 16px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:disabled { background: var(--accent-soft); border-color: var(--accent-soft); cursor: not-allowed; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .train { width: 100%; margin-top: 12px; padding: 12px; font-size: 1.05rem; }
    .link { background: none; border: none; color: var(--accent); padding: 4px 0; font-weight: 500; }
    .stage { min-height: 260px; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
    .mic { width: 104px; height: 104px; border-radius: 50%; border: 0; background: var(--accent-soft); display: grid; place-items: center; padding: 0; position: relative; }
    .mic::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--card); }
    .mic svg { position: relative; width: 40px; height: 40px; color: var(--muted); }
    .mic.ready { background: var(--accent); cursor: pointer; }
    .mic.ready svg { color: var(--accent); }
    .mic.listening { background: var(--hit); box-shadow: 0 0 0 calc(var(--level, 0) * 18px) color-mix(in srgb, var(--hit) 30%, transparent); transition: box-shadow 80ms linear; }
    .mic.listening svg { color: var(--hit); }
    .mic.heard { background: var(--hit); animation: pop 600ms ease-out; }
    @keyframes pop { 30% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .mic.heard { animation: none; } }
    .progress { width: 100%; max-width: 420px; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 400ms ease; }
    .score { width: 100%; max-width: 420px; }
    .bar { position: relative; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .bar .fill { height: 100%; width: 0; background: var(--accent); }
    .bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
    .heard-text { font-size: 1.3rem; font-weight: 700; color: var(--hit); min-height: 1.6em; }
    .slider { width: 100%; max-width: 420px; text-align: left; }
    .slider input { width: 100%; }
    .stats { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .stats b { display: block; font-size: 1.15rem; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .error { color: var(--error); }
    pre.log { text-align: left; width: 100%; max-height: 180px; overflow: auto; font-size: .78rem; background: var(--bg); border-radius: 8px; padding: 10px; }
    aside h2 { font-size: 1rem; margin: 6px 0 10px; }
    .jobs { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .jobs li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
    .jobs li button.active { border-color: var(--accent); background: var(--soft); }
    .badge { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .badge.done { color: var(--hit); } .badge.failed { color: var(--error); } .badge.running { color: var(--accent); }
    .notice { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Wake Word Studio</h1>
      <p class="lede">Train and download wake words. Each one is trained from scratch on commercially licensed data and tested right here in your browser.</p>
      <div id="notice" class="notice" hidden></div>

      <div class="panel">
        <form class="panel-top" id="train-form">
          <div class="row">
            <select id="language" aria-label="Language"><option>English</option></select>
            <input type="text" id="phrase" placeholder="Hey Computer" maxlength="40" autocomplete="off" aria-label="Wake phrase">
          </div>
          <div class="row" style="justify-content: space-between; align-items: center; margin-top: 6px;">
            <button type="button" class="link" id="hear" disabled>▶ Hear how the training voices say it</button>
            <select id="profile" aria-label="Training profile" style="width:auto;font-size:.9rem;padding:6px 8px">
              <option value="fast">Fast (about 12 min)</option>
              <option value="thorough">Thorough (about 1 h)</option>
            </select>
          </div>
          <button type="submit" class="primary train" id="train" disabled>Train</button>
        </form>

        <div class="stage" id="stage"></div>
      </div>
    </section>

    <aside>
      <h2>Your wake words</h2>
      <ul class="jobs" id="jobs"><li class="muted">None yet.</li></ul>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>

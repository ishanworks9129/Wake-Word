<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake Word Demo</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1b1d22; --muted: #5d6470; --line: #dde1e7; --accent: #2456d6; --hit: #1a7f37; --warn: #9a6700; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121418; --card: #1c1f25; --text: #eceef2; --muted: #a3aab6; --line: #2e333c; --accent: #6d93ff; --hit: #4ac26b; --warn: #d4a72c; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
    label { display: block; margin: 8px 0; }
    input[type=text], select { width: 100%; padding: 8px 10px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
    button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .kw { margin: 12px 0; }
    .kw-head { display: flex; justify-content: space-between; font-weight: 600; }
    .bar { position: relative; height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; margin-top: 4px; }
    .bar > .fill { height: 100%; width: 0; background: var(--accent); }
    .bar > .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
    .kw.hit .fill { background: var(--hit); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; }
    .pill.on { border-color: var(--hit); color: var(--hit); }
    #log { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
    #transcript { min-height: 1.5em; font-size: 1.1rem; }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <main>
    <h1>Wake word demo</h1>
    <p class="muted">Runs entirely in this tab. Nothing is sent anywhere unless you add a token broker below and the wake word fires.</p>

    <section class="card">
      <h2>Models</h2>
      <label>Package
        <select id="package">
          <option value="/models/wakeword/">Trained models (models/wakeword, from Colab)</option>
          <option value="/smoke/">Smoke-test package (tiny; for checking the plumbing only)</option>
        </select>
      </label>
      <p id="model-status" class="muted"></p>
      <div id="sensitivities"></div>
    </section>

    <section class="card">
      <div class="row">
        <button id="start" class="primary">Start listening</button>
        <button id="stop" disabled>Stop</button>
        <span class="pill" id="vad">silence</span>
        <span class="muted" id="noise"></span>
      </div>
      <div id="meters"></div>
    </section>

    <section class="card">
      <h2>Deepgram (optional)</h2>
      <p class="muted">Point at a running token broker (src/WakeWord.TokenBroker). In Development it accepts an X-Dev-User header.</p>
      <label>Token broker URL <input type="text" id="broker" placeholder="http://localhost:5038/v1/deepgram/token"></label>
      <label>Dev user (X-Dev-User) <input type="text" id="devuser" placeholder="me"></label>
      <div class="row"><button id="talk" disabled>Tap to talk</button><span class="muted" id="session"></span></div>
      <p id="transcript"></p>
    </section>

    <section class="card">
      <h2>Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
